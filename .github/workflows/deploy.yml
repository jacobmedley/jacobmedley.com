name: Deploy to SiteGround

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compute site iteration
        # Site version 12 started at commit 17f3eb2 (iteration 4 as of that
        # commit); each commit since then bumps the iteration by one, so the
        # footer version ticks up automatically on every push to main that
        # deploys. Bump lib/version.ts's SITE_VERSION and move this baseline
        # forward when a redesign warrants calling it a new site version.
        run: |
          BASELINE=17f3eb2f278748c493e3e150dafbf90c071b4267
          BASELINE_ITERATION=4
          COUNT=$(git rev-list --count "$BASELINE"..HEAD)
          echo "NEXT_PUBLIC_SITE_ITERATION=$((BASELINE_ITERATION + COUNT))" >> "$GITHUB_ENV"

      - name: Build (static export)
        run: npm run build

      - name: Deploy to SiteGround
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false
