    <script>
        async function fetchTimelineData() {
            const response = await fetch('data/timelineData.json');
            const data = await response.json();
            return data;
        }

        function createYearSection(year, content = null) {
            const section = document.createElement('section');
            section.id = `year-${year}`;
            section.classList.add('content-section');

            const div = document.createElement('div');
            div.classList.add('content');

            const yearHeading = document.createElement('h2');
            yearHeading.classList.add('display-12', 'fw-bold');
            yearHeading.textContent = year;
            div.appendChild(yearHeading);

            if (content) {
                const titleHeading = document.createElement('h3');
                titleHeading.classList.add('display-2', 'fw-bold', 'mb-4', 'text-capitalize');
                titleHeading.textContent = content.title;
                div.appendChild(titleHeading);

                content.description.forEach(paragraph => {
                    const p = document.createElement('p');
                    p.textContent = paragraph;
                    div.appendChild(p);
                });

                const hr = document.createElement('hr');
                div.appendChild(hr);

                const source = document.createElement('p');
                source.innerHTML = `Source: <a class="text-second-dark" href="${content.source.url}" target="_blank">${content.source.text} <i class="fa-regular fa-arrow-up-right-from-square"></i></a>`;
                div.appendChild(source);
            }

            section.appendChild(div);
            return section;
        }

        function createMainSection(title, intro, years, content, sectionClass) {
            const mainSection = document.createElement('section');
            mainSection.id = title.toLowerCase().replace(/ & /g, '-').replace(/\s+/g, '-');
            if (sectionClass) {
                sectionClass.split(' ').forEach(cls => mainSection.classList.add(cls));
            }

            if (intro) {
                const introSection = document.createElement('section');
                introSection.id = `intro-${mainSection.id}`;
                introSection.classList.add('content-section');
                const introDiv = document.createElement('div');
                introDiv.classList.add('content');
                const introHeading = document.createElement('h2');
                introHeading.classList.add('display-8', 'fw-bold');
                introHeading.textContent = intro.title;
                introDiv.appendChild(introHeading);
                const introSubheading = document.createElement('p');
                introSubheading.classList.add('display-6');
                introSubheading.textContent = intro.subtitle;
                introDiv.appendChild(introSubheading);
                introSection.appendChild(introDiv);
                mainSection.appendChild(introSection);
            }

            if (years && content) {
                let lastYear = parseInt(years[0]);
                years.forEach((year) => {
                    const currentYear = parseInt(year);

                    for (let fillerYear = lastYear + 1; fillerYear < currentYear; fillerYear++) {
                        const fillerSection = createYearSection(fillerYear);
                        mainSection.appendChild(fillerSection);
                    }

                    const yearSection = createYearSection(currentYear, content[year]);
                    mainSection.appendChild(yearSection);

                    lastYear = currentYear;
                });

                // Ensure all filler years up to 1860 are added
                for (let fillerYear = lastYear + 1; fillerYear <= 1860; fillerYear++) {
                    const fillerSection = createYearSection(fillerYear);
                    mainSection.appendChild(fillerSection);
                }
            }

            return mainSection;
        }

        async function populateTimeline() {
            const data = await fetchTimelineData();
            const container = document.getElementById('timeline-container');

            data.sections.forEach(section => {
                const mainSection = createMainSection(section.title, section.intro, section.years, section.content, section.class);
                container.appendChild(mainSection);
            });
        }

        populateTimeline();
    </script>
